backend:
  name: git-gateway
  branch: main

# Where uploaded photos are saved in the repo, and the URL path the site uses to show them
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "gallery"
    label: "Gallery"
    files:
      - name: "gallery_data"
        label: "Gallery Tabs & Albums"
        file: "data/gallery.json"
        fields:
          - label: "Tabs"
            name: "categories"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "These are the tab buttons visitors see on the Gallery page (Gala Night, Achievements, GFC Cup...). Add a new one here to create a brand new tab, then add albums below and set their Tab to match."
            fields:
              - { label: "Tab ID (lowercase, no spaces — e.g. community-day)", name: "id", widget: "string" }
              - { label: "Tab Name (shown to visitors)", name: "label", widget: "string" }

          - label: "Albums"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            hint: "Each album shows as a card under one of the Tabs above, and has its own page of photos."
            fields:
              - { label: "Album ID (unique, lowercase, no spaces — e.g. sports-day-2026)", name: "id", widget: "string" }
              - { label: "Tab", name: "category", widget: "string", hint: "Must exactly match a Tab ID from the Tabs list above" }
              - { label: "Title (shown on the card)", name: "title", widget: "string" }
              - { label: "Page heading", name: "subtitle", widget: "string", required: false }
              - { label: "Short description", name: "lede", widget: "text", required: false }
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Photo", name: "src", widget: "image" }
                  - { label: "Caption (optional, for accessibility)", name: "alt", widget: "string", required: false }

  - name: "players"
    label: "Players"
    files:
      - name: "players_data"
        label: "Players Roster"
        file: "data/players.json"
        fields:
          - label: "Players"
            name: "players"
            widget: "list"
            summary: "{{fields.name}} — {{fields.position}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Position"
                name: "position"
                widget: "select"
                options: ["Keeper", "Defender", "Midfielder", "Forward"]
              - { label: "Photo", name: "photo", widget: "image" }

  - name: "shop"
    label: "Shop"
    files:
      - name: "shop_data"
        label: "Merchandise"
        file: "data/shop.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            hint: "Visitors browse these on the Shop page and send an enquiry to order — there's no online payment, so pricing and pickup/payment is arranged directly with the club."
            fields:
              - { label: "Item ID (unique, lowercase, no spaces — e.g. home-jersey-2026)", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (e.g. $45)", name: "price", widget: "string" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Description (optional)", name: "description", widget: "text", required: false }
              - label: "Available sizes"
                name: "sizes"
                widget: "select"
                multiple: true
                hint: "Pick every size available for this item. Choose just 'Not applicable' for items that don't need a size (e.g. keyrings, mugs, scarves)."
                options: ["Not applicable", "XS", "S", "M", "L", "XL", "XXL", "One size"]
                default: ["Not applicable"]

  - name: "gfccup"
    label: "GFC Cup"
    files:
      - name: "gfccup_data"
        label: "GFC Cup — Groups & Fixtures"
        file: "data/gfccup.json"
        fields:
          - { label: "Tournament name (shown as the page title)", name: "tournamentName", widget: "string", default: "GFC Cup" }

          - label: "Groups"
            name: "groups"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "The group table tabs visitors see (Group A, Group B...). Add teams here — the Group Table standings are worked out automatically from the scores you enter in Fixtures below, so you don't need to enter points or wins yourself."
            fields:
              - { label: "Group ID (single letter, e.g. A)", name: "id", widget: "string" }
              - { label: "Group Name (shown to visitors)", name: "label", widget: "string" }
              - label: "Teams in this group"
                name: "teams"
                widget: "list"
                default: []
                summary: "{{fields.name}}"
                hint: "Add as many or as few teams as this group has. Type each name exactly as you'll use it in Fixtures below (spelling must match)."
                fields:
                  - label: "Team Slot (internal — set once, don't change it afterwards)"
                    name: "id"
                    widget: "string"
                    hint: "This is how fixtures know which team is which behind the scenes (e.g. A1). Leave it as it already is — renaming the club below is all you need to do; the new name shows up everywhere automatically."
                  - { label: "Team name (shown to visitors — rename any time)", name: "name", widget: "string" }
                  - { label: "Team logo (optional)", name: "logo", widget: "image", required: false }
                  - { label: "Short club description (optional, shown on the club's page)", name: "description", widget: "text", required: false }
                  - { label: "Manager (optional)", name: "manager", widget: "string", required: false }
                  - { label: "Coach (optional)", name: "coach", widget: "string", required: false }
                  - label: "Squad"
                    name: "players"
                    widget: "list"
                    default: []
                    summary: "#{{fields.number}} {{fields.name}}"
                    hint: "Click a team's name on the GFC Cup page to see this squad list, with the Manager and Coach shown at the bottom."
                    fields:
                      - { label: "Jersey number", name: "number", widget: "string", required: false }
                      - { label: "Player name", name: "name", widget: "string" }
                      - label: "Position"
                        name: "position"
                        widget: "select"
                        options: ["Keeper", "Defender", "Midfielder", "Forward"]
                        required: false

          - label: "Fixtures"
            name: "fixtures"
            widget: "list"
            summary: "{{fields.stage}} — {{fields.team1}} vs {{fields.team2}} ({{fields.date}} {{fields.time}}, {{fields.field}})"
            hint: "One entry per match — group stage or knockout. Date, Time and Field are free text, so you can change any of them on any match at any time — just open the match below and edit those fields. Leave both scores blank until the match is played; once you fill them in, the Group Table updates itself — and for knockout matches, see the Team 1 / Team 2 hints below for how those fill in automatically too."
            fields:
              - { label: "Match ID (unique, e.g. g1, qf1, sf1, final)", name: "id", widget: "string" }
              - label: "Stage"
                name: "stage"
                widget: "select"
                options: ["Group Stage", "Quarter Final", "Semi Final", "Final"]
                default: "Group Stage"
              - { label: "Group (only for Group Stage — must match a Group ID above, e.g. A)", name: "group", widget: "string", required: false }
              - { label: "Date (e.g. 27 June 2026)", name: "date", widget: "string", required: false }
              - { label: "Time (e.g. 8:00 AM)", name: "time", widget: "string", required: false }
              - { label: "Field / venue (optional)", name: "field", widget: "string", required: false }
              - label: "Team 1"
                name: "team1"
                widget: "string"
                hint: "For a group-stage match, type that team's Team Slot from Groups above (e.g. A1) — not its name, so the match keeps showing the right team even after you rename the club. For a knockout match, you don't need to know the real team yet — type 'Winner Group A', 'Runner-up Group A' (swap in the right group letter), or 'Winner <Match ID>' (e.g. 'Winner qf1') and the site will automatically fill in and link the real team once that result is known."
              - label: "Team 2"
                name: "team2"
                widget: "string"
                hint: "Same as Team 1 — a Team Slot (e.g. B2), or a placeholder like 'Winner Group B', 'Runner-up Group B', or 'Winner sf1' that resolves itself automatically."
              - { label: "Team 1 score (leave blank until played)", name: "score1", widget: "number", value_type: "int", required: false }
              - { label: "Team 2 score (leave blank until played)", name: "score2", widget: "number", value_type: "int", required: false }
              - label: "Goal scorers"
                name: "goals"
                widget: "list"
                default: []
                summary: "{{fields.player}} ({{fields.goals}})"
                hint: "One entry per scorer in this match — these automatically add up into the tournament's Top Scorers table on the Stats tab."
                fields:
                  - { label: "Player name", name: "player", widget: "string" }
                  - { label: "Team (the Team Slot or current name from Team 1 / Team 2 above)", name: "team", widget: "string" }
                  - { label: "Goals scored in this match", name: "goals", widget: "number", value_type: "int", default: 1 }
              - label: "Cards"
                name: "cards"
                widget: "list"
                default: []
                summary: "{{fields.player}} — {{fields.type}}"
                hint: "One entry per card shown in this match — these add up into the tournament's Cards table on the Stats tab."
                fields:
                  - { label: "Player name", name: "player", widget: "string" }
                  - { label: "Team (the Team Slot or current name from Team 1 / Team 2 above)", name: "team", widget: "string" }
                  - label: "Card"
                    name: "type"
                    widget: "select"
                    options: ["Yellow", "Red"]
                    default: "Yellow"
